name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee /tmp/clippy.log || {
            { echo '## Clippy (last 30000 bytes)'; echo '```'; tail -c 30000 /tmp/clippy.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            printf '::error title=clippy output::%s\n' "$(tail -c 30000 /tmp/clippy.log | sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | head -c 6000)"
            exit 1
          }
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked

  # Both routes of scripts/build-on-linux.sh (building the exe from Linux for
  # a run under Wine): the MinGW one and the MSVC one through cargo-xwin,
  # which is the only one with the D3D12 Agility exports.
  linux-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolchain: mingw, target: x86_64-pc-windows-gnu }
          - { toolchain: xwin, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.target }}
      - name: Install the cross compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.toolchain == 'mingw' && 'mingw-w64' || 'clang' }}
      - name: Install cargo-xwin
        if: matrix.toolchain == 'xwin'
        run: cargo install cargo-xwin --locked
      - name: Build
        run: |
          set -o pipefail
          cargo ${{ matrix.toolchain == 'mingw' && 'build' || 'xwin build' }} --release --locked --target ${{ matrix.target }} -p victory 2>&1 | tee /tmp/build.log || {
            { echo "## Build ${{ matrix.target }} (last 30000 bytes)"; echo '```'; tail -c 30000 /tmp/build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            printf '::error title=build ${{ matrix.target }}::%s\n' "$(tail -c 30000 /tmp/build.log | sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | head -c 6000)"
            exit 1
          }
      - name: The exe exists
        run: ls -l target/${{ matrix.target }}/release/victory.exe && sha256sum target/${{ matrix.target }}/release/victory.exe
